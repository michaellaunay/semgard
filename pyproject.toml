[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semgard"
version = "0.1.0"
description = "Semantic guard against prompt injection using deterministic rules over MorphoRepr semantic tags."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LGPL-3.0-or-later" }
authors = [{ name = "Michaël Launay", email = "michaellaunay@logikascium.com" }]
keywords = ["prompt-injection", "llm-security", "controlled-language", "morphorepr", "esperanto"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
  "Topic :: Security",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
model = ["transformers>=4.40", "torch>=2.2"]
dev = ["pytest>=8.0"]
# Planned dependency (ADR-001): use morphorepr as a library once its parser is
# parameterized by an inventory. Until then, semgard.parser carries a compatible
# implementation.
# morphorepr = ["morphorepr @ git+https://github.com/michaellaunay/morphorepr"]

[project.scripts]
semgard = "semgard.cli:main"

[tool.setuptools.packages.find]
include = ["semgard*"]

[tool.setuptools.package-data]
semgard = ["lexicon/*.json", "lexicon/*.yaml", "classifiers/calibration/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
