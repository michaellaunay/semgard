# Default SemGard v0.1 rule set.
# Regexes operate on morphemic chains from the semgard profile:
#   (kash|kod)? - vi? - (mal|ne)? - root - ig? - (u|as|us|o)
# Conventions: `match` = per term; `stream` = segment stream; `lexical` = text.
version: "0.1"
rules:
  - id: override_rules
    description: "Instruction addressed to the system asking it to contradict or ignore its rules."
    match: "^(?:kash-|kod-)?vi-(?:mal-|ne-)regul-(?:ig-)?(?:u|us)$"
    min_gamma: 0.6
    severity: critical
    action: block

  - id: rules_directive
    description: "Instruction addressed to the system about its rules, without explicit polarity."
    match: "^(?:kash-|kod-)?vi-regul-(?:ig-)?(?:u|us)$"
    min_gamma: 0.6
    severity: high
    action: quarantine

  - id: persona_switch
    description: "Request for the system to adopt an identity or mode (role-based jailbreak)."
    match: "^(?:kash-|kod-)?vi-(?:mal-)?rol-(?:ig-)?(?:u|us)$"
    min_gamma: 0.55
    severity: high
    action: quarantine

  - id: secret_exfiltration
    description: "Request to reveal or transmit secrets, with or without an explicit addressee."
    match: "^(?:kash-|kod-)?(?:vi-)?(?:ne-)?sekr-(?:ig-)?u$"
    min_gamma: 0.6
    severity: critical
    action: block

  - id: tool_abuse
    description: "Instruction addressed to the system to execute an action or use a tool."
    match: "^(?:kash-|kod-)?vi-ilo-(?:ig-)?(?:u|us)$"
    min_gamma: 0.6
    severity: high
    action: quarantine

  - id: output_control
    description: "Constraint imposed on the system response."
    match: "^(?:kash-|kod-)?vi-(?:ne-)?elig-(?:ig-)?(?:u|us)$"
    min_gamma: 0.6
    severity: medium
    action: mark

  - id: hidden_directive
    description: "Any instruction in a hidden or decoded channel is suspicious by construction."
    match: "^(?:kash|kod)-.*-(?:u|us)$"
    min_gamma: 0.5
    severity: high
    action: quarantine

  - id: hidden_addressed
    description: "Hidden or decoded content addressed to the system, even when non-directive."
    match: "^(?:kash|kod)-vi-"
    min_gamma: 0.5
    severity: medium
    action: mark

  - id: persona_then_action
    description: "Role switch followed within four segments by an action, secret, output, or rule request."
    stream: "vi-(?:mal-)?rol-(?:ig-)?us(?:.|\\n){0,200}?(?:^|\\s|\\|)(?:vi-)?(?:mal-|ne-)?(?:sekr|ilo|elig|regul)-(?:ig-)?u"
    within: 4
    min_gamma: 0.5
    severity: critical
    action: block

  - id: lexical_ignore_instructions
    description: "Classic lexical marker; useful as a fast shortcut, but prone to false positives in security tickets."
    lexical: "(?i)\\b(?:ignore|disregard|forget)\\s+(?:all\\s+|any\\s+)?(?:previous|prior|above|earlier|the)\\s+(?:instructions|prompts?|rules)|\\bignore[sz]?\\s+(?:toutes\\s+)?(?:les|tes|vos)\\s+(?:instructions|consignes)\\s+pr[\u00e9e]c[\u00e9e]dentes"
    gamma: 0.5
    severity: medium
    action: mark
